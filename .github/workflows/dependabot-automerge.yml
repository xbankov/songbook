name: Dependabot auto-merge

# Enables GitHub auto-merge on Dependabot minor and patch updates. Major
# updates (including grouped PRs that contain any major bump) stay open for a
# manual review. GitHub merges an enabled PR once
# the required checks of the "Protect main" ruleset ("CI passed" and
# "Sourcery review") succeed. A failing check leaves the PR open for a human.
#
# This workflow never checks out or runs PR code.
#
# AUTOMERGE_TOKEN is a fine-grained PAT (this repository only; Contents and
# Pull requests: read and write) stored as a *Dependabot* secret, because
# Dependabot-triggered runs cannot read Actions secrets. A PAT is required:
# a merge made with GITHUB_TOKEN does not trigger the push-to-main CI run, so
# no image would be built or promoted to :latest.

on:
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  automerge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    steps:
      # For grouped PRs, update-type is the highest bump in the group.
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip major updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: echo "Major update; leaving the PR for a manual review."

      - name: Enable auto-merge (rebase)
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "AUTOMERGE_TOKEN Dependabot secret is not set" >&2
            exit 1
          fi
          gh pr merge --auto --rebase "$PR_URL"
